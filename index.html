<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baller Buzzer</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0b0f14;color:#f2f5f8;font-family:"Segoe UI",system-ui,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .card{background:#131a22;border:1px solid #233040;border-radius:14px;
        padding:34px 30px;width:min(360px,90vw);display:flex;flex-direction:column;gap:16px;}
  h1{font-size:20px;letter-spacing:.14em;}
  .credit{font-size:11px;letter-spacing:.14em;color:#ffb300;opacity:.85;}
  input[type=password]{font:inherit;font-size:18px;background:#0b0f14;color:#f2f5f8;
        border:1px solid #233040;border-radius:8px;padding:12px;width:100%;}
  input[type=password]:focus{outline:2px solid #ffb300;border-color:#ffb300;}
  button{font:inherit;font-size:16px;font-weight:700;letter-spacing:.08em;
        background:#ffb300;color:#0b0f14;border:0;border-radius:8px;padding:13px;cursor:pointer;}
  label{display:flex;gap:8px;align-items:center;font-size:13px;color:#8aa0b4;}
  #err{color:#e5484d;font-size:13px;min-height:16px;}
  #busy{color:#8aa0b4;font-size:13px;}
</style>
</head>

</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function derive(pw){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw),
    "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(SALT), iterations:ITER,
    hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function open_(key){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(IV)}, key, b64(CT));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("err"), busy = document.getElementById("busy");
  err.textContent = ""; busy.textContent = "Unlocking\u2026";
  try {
    const key = await derive(document.getElementById("pw").value);
    if (document.getElementById("rem").checked)
      localStorage.setItem("nxl_lock_key",
        JSON.stringify(await crypto.subtle.exportKey("jwk", key)));
    await open_(key);
  } catch {
    busy.textContent = "";
    err.textContent = "Wrong password.";
  }
});
(async () => {                       // remembered device: unlock silently
  const saved = localStorage.getItem("nxl_lock_key");
  if (!saved) return;
  // document.write() during parsing APPENDS instead of replacing, which left
  // this lock form sitting above the scoreboard. Wait for the parse to finish
  // so document.open() clears the page properly.
  if (document.readyState === "loading")
    await new Promise(r => document.addEventListener("DOMContentLoaded", r, {once: true}));
  try {
    const key = await crypto.subtle.importKey("jwk", JSON.parse(saved),
      {name:"AES-GCM"}, true, ["decrypt"]);
    await open_(key);
  } catch { localStorage.removeItem("nxl_lock_key"); }
})();
